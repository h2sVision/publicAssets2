<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Velorah</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --background: 201 100% 13%;
      --foreground: 0 0% 100%;
      --muted-foreground: 240 4% 66%;

      --primary: 0 0% 100%;
      --primary-foreground: 0 0% 4%;

      --secondary: 0 0% 10%;
      --muted: 0 0% 10%;
      --accent: 0 0% 10%;

      --border: 0 0% 18%;
      --input: 0 0% 18%;

      --font-display: 'Instrument Serif', serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: var(--font-body);
    }

    body {
      position: relative;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes fade-rise {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-rise {
      animation: fade-rise 0.8s ease-out both;
    }

    .animate-fade-rise-delay {
      animation: fade-rise 0.8s ease-out 0.2s both;
    }

    .animate-fade-rise-delay-2 {
      animation: fade-rise 0.8s ease-out 0.4s both;
    }
  </style>
</head>

<body class="relative min-h-screen">

  <!-- Background Video -->
  <video
    autoPlay
    loop
    muted
    playsInline
    class="absolute inset-0 w-full h-full object-cover z-0"
  >
    <source
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4"
      type="video/mp4"
    />
  </video>

  <!-- Page Wrapper -->
  <main class="relative z-10 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="relative z-10">
      <div class="max-w-7xl mx-auto flex items-center justify-between px-8 py-6">

        <!-- Logo -->
        <div
          class="text-3xl tracking-tight text-white"
          style="font-family: 'Instrument Serif', serif;"
        >
          Velorah<sup class="text-xs">®</sup>
        </div>

        <!-- Nav Links -->
        <div class="hidden md:flex items-center gap-8">
          <a
            href="#"
            class="text-sm text-white transition-colors"
          >
            Home
          </a>

          <a
            href="#"
            class="text-sm text-[hsl(var(--muted-foreground))] hover:text-white transition-colors"
          >
            Studio
          </a>

          <a
            href="#"
            class="text-sm text-[hsl(var(--muted-foreground))] hover:text-white transition-colors"
          >
            About
          </a>

          <a
            href="#"
            class="text-sm text-[hsl(var(--muted-foreground))] hover:text-white transition-colors"
          >
            Journal
          </a>

          <a
            href="#"
            class="text-sm text-[hsl(var(--muted-foreground))] hover:text-white transition-colors"
          >
            Reach Us
          </a>
        </div>

        <!-- CTA -->
        <button
          class="liquid-glass rounded-full px-6 py-2.5 text-sm text-white transition-transform duration-300 hover:scale-[1.03]"
        >
          Begin Journey
        </button>
      </div>
    </nav>

    <!-- Hero -->
    <section
      class="relative z-10 flex-1 flex flex-col items-center justify-center text-center px-6 pt-32 pb-40 py-[90px]"
    >

      <!-- Heading -->
      <h1
        class="animate-fade-rise text-5xl sm:text-7xl md:text-8xl leading-[0.95] tracking-[-2.46px] max-w-7xl font-normal text-white"
        style="font-family: 'Instrument Serif', serif;"
      >
        Where
        <em class="not-italic text-[hsl(var(--muted-foreground))]">
          dreams
        </em>
        rise
        <br />
        <em class="not-italic text-[hsl(var(--muted-foreground))]">
          through the silence.
        </em>
      </h1>

      <!-- Subtext -->
      <p
        class="animate-fade-rise-delay text-[hsl(var(--muted-foreground))] text-base sm:text-lg max-w-2xl mt-8 leading-relaxed"
      >
        We're designing tools for deep thinkers, bold creators, and quiet rebels.
        Amid the chaos, we build digital spaces for sharp focus and inspired work.
      </p>

      <!-- Hero CTA -->
      <button
        class="animate-fade-rise-delay-2 liquid-glass rounded-full px-14 py-5 text-base text-white mt-12 transition-transform duration-300 hover:scale-[1.03] cursor-pointer"
      >
        Begin Journey
      </button>

    </section>
  </main>
</body>
</html>
